<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — IELTS Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,96,600;1,36,400&family=Plus+Jakarta+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="landing.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="lp-body">
  <div class="lp-auth">
    <aside class="lp-auth-side">
      <a class="lp-brand" href="index.html"><img src="assets/logo.png" alt="" width="32" height="32"><span>IELTS Prep</span></a>
      <div class="lp-auth-pitch">
        <h1 class="lp-h2">Buat password baru.</h1>
        <p>Tinggal selangkah lagi — masukkan password baru untuk akunmu, lalu kamu bisa masuk lagi.</p>
      </div>
      <p class="lp-auth-side-foot">Platform latihan independen, bukan aplikasi resmi IELTS.</p>
    </aside>

    <main class="lp-auth-main">
      <div class="lp-auth-top">
        <a class="lp-brand" href="index.html"><img src="assets/logo.png" alt="" width="32" height="32"><span>IELTS Prep</span></a>
        <a class="lp-textlink" href="login.html">← Halaman masuk</a>
      </div>

      <div class="lp-auth-center">
        <div class="auth-card">
          <h2 id="rp-title">Atur password baru</h2>
          <p class="auth-sub" id="rp-sub">Masukkan password baru kamu di bawah ini.</p>

          <form id="rp-form" autocomplete="on">
            <div class="field">
              <label for="rp-pass">Password baru</label>
              <div class="password-wrap">
                <input type="password" id="rp-pass" placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password">
                <button type="button" class="pw-toggle" data-target="rp-pass" aria-label="Tampilkan password"></button>
              </div>
            </div>
            <div class="field">
              <label for="rp-pass2">Konfirmasi password baru</label>
              <div class="password-wrap">
                <input type="password" id="rp-pass2" placeholder="Ketik ulang password" autocomplete="new-password">
                <button type="button" class="pw-toggle" data-target="rp-pass2" aria-label="Tampilkan password"></button>
              </div>
            </div>
            <button class="lp-btn lp-btn-block" id="rp-submit" type="submit">Simpan Password Baru</button>
          </form>

          <div class="auth-msg" id="rp-msg" role="status" aria-live="polite"></div>
          <a href="login.html" class="link-btn lp-back-link">← Kembali ke halaman masuk</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/pw-toggle.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
